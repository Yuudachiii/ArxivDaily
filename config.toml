# ArxivDaily 唯一公开配置入口。改此文件后提交到 main，下一次 Actions 生效。
# 不要写入任何 API key 或 SendKey；运行凭证由环境变量 / GitHub Actions Secrets 提供。
# 配置说明：docs/CONFIGURATION.md；提示说明：docs/PROMPTS.md。
# 当前用途：大语言模型（LLM）研究每日简报。日常路径不做任何模型调用，也不需要 LLM 密钥。

# 日常入口一：每篇论文的内容模块。true = 勾选，false = 不生成、不显示。
# 按标题、标题翻译、摘要、摘要翻译、总结、证据、来源、初筛路径的固定顺序呈现。
# 规则模式不生成总结和证据；不勾选 llm_summary/evidence 时不读取正文。
[presentation]
title = true
title_translation = true
abstract = true
abstract_translation = true
llm_summary = false
evidence = false
source = true
screening_routes = true

# arXiv 初筛：任一交叉分类命中即可；categories=[] 表示不限分类。
# 标题和摘要都参与关键词匹配。
[rules]
categories = ["cs.CL", "cs.LG", "cs.AI", "cs.CV"]
title_enabled = true
exclude = []

# 同义词组：同组词之间是 OR，大小写不敏感，按完整词和短语匹配。
# 覆盖 LLM 研究的核心主题；可按自己的方向增删词组。
[rules.groups]

# 大语言模型本体与基础模型
LLM = [
    "large language model",
    "large language models",
    "LLM",
    "LLMs",
    "language model",
    "language models",
    "pretrained language model",
    "pretrained language models",
    "foundation model",
    "foundation models",
    "base model"
]

# 训练：预训练、后训练、指令微调、偏好对齐
TRAIN = [
    "pre-training",
    "pretraining",
    "post-training",
    "post training",
    "instruction tuning",
    "instruction-tuned",
    "supervised fine-tuning",
    "supervised finetuning",
    "SFT",
    "RLHF",
    "reinforcement learning from human feedback",
    "DPO",
    "direct preference optimization",
    "GRPO",
    "fine-tuning",
    "finetuning"
]

# 推理与提示：思维链、上下文学习、测试时计算
INFER = [
    "chain-of-thought",
    "chain of thought",
    "CoT",
    "reasoning",
    "in-context learning",
    "in-context",
    "prompting",
    "prompt engineering",
    "test-time compute",
    "test time compute",
    "step-by-step reasoning",
    "self-consistency"
]

# Agent：工具调用、函数调用、多智能体
AGENT = [
    "agent",
    "agents",
    "agentic",
    "tool use",
    "tool-use",
    "tool calling",
    "function calling",
    "function-call",
    "multi-agent",
    "multi agent"
]

# 检索增强生成
RAG = [
    "retrieval-augmented generation",
    "retrieval augmented generation",
    "retrieval-augmented",
    "retrieval augmentation",
    "RAG",
    "graph retrieval"
]

# 效率：量化、KV cache、MoE、长上下文、投机解码、蒸馏
EFF = [
    "quantization",
    "quantized",
    "KV cache",
    "key-value cache",
    "mixture of experts",
    "mixture-of-experts",
    "MoE",
    "long context",
    "long-context",
    "speculative decoding",
    "distillation",
    "distilled",
    "pruning",
    "sparse attention",
    "flash attention"
]

# 安全与对齐
SAFETY = [
    "alignment",
    "aligned",
    "hallucination",
    "hallucinations",
    "jailbreak",
    "jailbreaking",
    "red teaming",
    "red-teaming",
    "safety",
    "harmlessness",
    "toxicity"
]

# 多模态大模型 / 视觉语言模型
MM = [
    "multimodal large language model",
    "multi-modal large language model",
    "multimodal LLM",
    "MLLM",
    "vision-language model",
    "vision language model",
    "vision-language models",
    "VLM",
    "large multimodal model",
    "multimodal foundation model",
    "LMM"
]

# 评测与基准
EVAL = [
    "benchmark",
    "benchmarks",
    "evaluation",
    "evaluations",
    "leaderboard",
    "human evaluation"
]

# 组合规则：
# 路线之间 OR；
# 每个内层列表中的组之间 AND；
# 多个内层列表 OR。
# 具体方向在前、llm_core 最后：规则模式取“首个命中路线”，因此顺序也决定条目归属展示。
[rules.routes]
llm_reasoning = [["LLM", "INFER"]]
llm_training = [["LLM", "TRAIN"]]
llm_agent = [["LLM", "AGENT"]]
llm_rag = [["LLM", "RAG"]]
llm_efficiency = [["LLM", "EFF"]]
llm_safety = [["LLM", "SAFETY"]]
llm_multimodal = [["LLM", "MM"]]
llm_eval = [["LLM", "EVAL"]]
llm_core = [["LLM"]]

# 正文名额分配顺序（规则模式下全部为翻译档，顺序决定条目排列）。
[selection]
mode = "rules"
route_priority = [
    "llm_reasoning",
    "llm_training",
    "llm_agent",
    "llm_rag",
    "llm_efficiency",
    "llm_safety",
    "llm_multimodal",
    "llm_eval",
    "llm_core"
]

# 翻译服务：Actions 的每日任务会按 matrix 覆盖为 google_free / microsoft_free，
# 两者免费且不需要密钥，每个变体运行一次、推送一次。
# 留下 provider = "llm" 作为本地测试的兼容默认值；规则模式不会调用 LLM，
# 本地真实运行可显式使用 --translation-provider google_free。
# 其他可选值：deepl（需要 TRANSLATION_API_KEY）、libretranslate（自建实例）。
# label 会追加到微信推送标题，便于区分两个变体；留空则不加后缀。
[translation]
provider = "llm"
label = ""
# llm 模式复用 llm.filter；以下端点和密钥引用仅用于机器翻译服务。
# TRANSLATION_API_KEY 是环境变量/Secret 的名称，不是已经创建好的密钥。
# 切换 deepl 后，需要自己在 DeepL API 账户创建 key，再配置同名 Secret。
base_url = "https://api-free.deepl.com"
api_key_env = "TRANSLATION_API_KEY"
timeout = 30
attempts = 3
retry_delay_seconds = 1

# 完整总结每日默认 5 篇，最多 10 篇；规则模式不生成总结，不受此上限限制。
[limits]
full_daily_limit = 5
review_daily_limit = 2
stage_attempts = 3
recovery_days = 14
run_seconds = 2400

# 日常入口二：本目录集中存放六项任务提示。相对路径以本配置文件所在目录为基准。
# 规则模式不读取提示文件，但配置校验仍要求提示目录完整。
[prompts]
directory = "app/prompts"

# 以下为高级配置，通常保持默认。首次抓取最近 7 天，后续最多回看 14 天；网络请求间隔至少 3 秒。
[collection]
page_size = 100
delay_seconds = 3.0
initial_days = 7
lookback_days = 14
shard_limit = 10000
max_candidates = 2000

# 以下 LLM 配置在规则模式下不会使用；保留以便切回 mode = "llm" 时仍可运行。
# 可选单次运行费用保护（按配置币种估计，非精确账单）：取消下一行注释启用。
[llm]
# max_run_cost = 12.5

# 摘要终筛使用 high 思考预算。标题/摘要翻译复用该模型，关闭思考。
[llm.filter]
provider = "deepseek"
protocol = "chat_completions"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
effort = "high"
max_tokens = 16384
timeout = 120
stage_seconds = 180
attempts = 3
retry_delay_seconds = 1
image_capable = false
input_chars = 30000

# 正文复审、长文证据提取、总结使用 max 思考预算。
[llm.summary]
provider = "deepseek"
protocol = "chat_completions"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
effort = "max"
max_tokens = 65536
timeout = 240
stage_seconds = 900
attempts = 3
retry_delay_seconds = 1
image_capable = true
input_chars = 120000
max_section_calls = 64

# 费用估算参数。更换模型、提供商、端点或价格时，需同时将 policy 改为 custom，并自行核实价格。
[llm.pricing]
cache_hit_per_million = 0.04
cache_miss_per_million = 2.0
output_per_million = 8.0
currency = "CNY"
policy = "peak_upper_bound"

# 正文下载、解析和必要图表读取限制。
[fulltext]
timeout = 30
attempts = 3
min_chars = 2500
chunk_chars = 20000
max_download_bytes = 25000000
max_visual_pages = 8

# 推送密钥只填写环境变量名称，不能填写密钥值。发送、告警和重试共同受每日额度限制。
# 规则模式每日只需要 SERVERCHAN_SENDKEY 一个 Secret。
[delivery]
sendkey_env = "SERVERCHAN_SENDKEY"
daily_limit = 5
chain_attempts = 3
poll_limit = 3
body_bytes = 30000
quota_timezone = "Asia/Shanghai"
query_counts_quota = false

# 正式状态和公开历史分支。本地留空时 Actions 会按 matrix 覆盖为：
# arxivdaily-state-google / arxivdaily-state-microsoft。
# 留空时 Actions 按当前 owner/repo 和 state_branch 生成地址，fork 无需改用户名。
# 本地 --send 需显式填写自己仓库的公开归档地址。
[archive]
public_base_url = ""
state_branch = "arxivdaily-state"
