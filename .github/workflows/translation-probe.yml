name: Translation probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translators
        run: python -m pip install --quiet translators
      - name: Probe library engines with default region
        run: |
          python - <<'PY'
          import translators as ts
          text = 'Large language model reasoning with reinforcement learning'
          for engine in ('google', 'bing', 'youdao'):
              try:
                  out = ts.translate_text(text, translator=engine, from_language='en', to_language='zh')
                  print(f'ENGINE {engine}: OK :: {str(out)[:80]}', flush=True)
              except Exception as exc:
                  print(f'ENGINE {engine}: FAIL :: {type(exc).__name__}: {str(exc)[:160]}', flush=True)
          PY
      - name: Probe direct google throughput
        run: |
          python - <<'PY'
          import time, urllib.parse, urllib.request
          ok = 0
          codes = {}
          for i in range(40):
              url = ('https://translate.googleapis.com/translate_a/single'
                     '?client=gtx&sl=en&tl=zh-CN&dt=t&q=' +
                     urllib.parse.quote(f'large language model test sentence {i} about reasoning and agents'))
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      ok += 1
              except Exception as exc:
                  code = getattr(exc, 'code', None) or type(exc).__name__
                  codes[code] = codes.get(code, 0) + 1
              time.sleep(1)
          print('THROUGHPUT ok=', ok, 'fail=', 40 - ok, 'codes=', codes, flush=True)
          PY
