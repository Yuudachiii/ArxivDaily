name: Translation probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install translators
        run: python -m pip install --quiet translators
      - name: Probe free engines
        run: |
          python - <<'PY'
          import os
          os.environ['translators_default_region'] = 'CN'
          import translators as ts
          text = 'Large language model reasoning with reinforcement learning'
          for engine in ('google', 'bing', 'youdao', 'qq', 'baidu'):
              try:
                  out = ts.translate_text(text, translator=engine, from_language='en', to_language='zh')
                  print(f'ENGINE {engine}: OK :: {str(out)[:80]}', flush=True)
              except Exception as exc:
                  print(f'ENGINE {engine}: FAIL :: {type(exc).__name__}: {str(exc)[:160]}', flush=True)
          PY
      - name: Probe raw endpoints and semantic scholar
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse
          def get(url, headers=None):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0', **(headers or {})})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read()[:120]
              except Exception as exc:
                  return getattr(exc, 'code', None), str(exc)[:120]
          q = urllib.parse.quote('Large language model reasoning')
          print('GOOGLE_GTX:', get(f'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q={q}'))
          print('MS_EDGE_AUTH:', get('https://edge.microsoft.com/translate/auth'))
          print('MYMEMORY:', get('https://api.mymemory.translated.net/get?q=hello&langpair=en|zh-CN'))
          print('SEMANTIC_SCHOLAR:', get('https://api.semanticscholar.org/graph/v1/paper/arXiv:2501.00001?fields=title,citationCount'))
          print('ARXIV_STATS:', get('https://arxiv.org/stats/'))
          PY
