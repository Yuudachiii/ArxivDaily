name: Daily arXiv digest

on:
  schedule:
    # Beijing time is set explicitly so the cron expression is not UTC.
    - cron: '0 10 * * *'
      timezone: Asia/Shanghai
  workflow_dispatch:
    inputs:
      mode:
        description: Daily window, replay IDs, backfill dates, or retry a saved stage
        type: choice
        options: [daily, replay, backfill, retry]
        default: daily
        required: true
      ids:
        description: arXiv IDs separated by spaces or commas (replay or retry)
        type: string
        required: false
      retry_stage:
        description: Saved stage to retry for the IDs above (retry mode only)
        type: choice
        options: [selection, body, review, summary, translation, title_translation, delivery]
        default: delivery
        required: false
      start:
        description: UTC start date YYYY-MM-DD (backfill only)
        type: string
        required: false
      end:
        description: UTC end date YYYY-MM-DD (backfill only)
        type: string
        required: false
      send:
        description: Send notification and update shared state; a dry-run still performs real arXiv and free-translation requests
        type: boolean
        default: false
        required: true

permissions:
  contents: write

jobs:
  digest:
    name: Daily digest (${{ matrix.translation.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Two independent variants push two distinguishable digests per day.
      fail-fast: false
      matrix:
        translation:
          - provider: google_free
            label: 谷歌
            state: google
            state_branch: arxivdaily-state-google
          - provider: microsoft_free
            label: 微软
            state: microsoft
            state_branch: arxivdaily-state-microsoft
    concurrency:
      # Never cancel the sibling variant; only serialize the same variant.
      group: arxivdaily-state-${{ matrix.translation.state }}
      cancel-in-progress: false
    env:
      TMPDIR: ${{ github.workspace }}/app/tmp
      PIP_CACHE_DIR: ${{ github.workspace }}/app/tmp/pip-cache
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          # The bootstrap step may create the state branch once. checkout
          # removes its temporary credential from Git config after the job.
          persist-credentials: true
      - name: Prepare workspace temporary directories
        run: mkdir -p tmp/pip-cache
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare public configuration
        id: config
        env:
          REPOSITORY: ${{ github.repository }}
          TRANSLATION_PROVIDER: ${{ matrix.translation.provider }}
          TRANSLATION_LABEL: ${{ matrix.translation.label }}
          STATE_BRANCH: ${{ matrix.translation.state_branch }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          from arxivdaily.config import load_config
          from arxivdaily.prompts import load_prompts

          path = Path('../config.toml')
          config = load_config(path)
          load_prompts(config)
          repository = os.environ['REPOSITORY']
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository)
          branch = os.environ.get('STATE_BRANCH') or config['archive']['state_branch']
          provider = os.environ.get('TRANSLATION_PROVIDER') or config['translation']['provider']
          label = os.environ.get('TRANSLATION_LABEL')
          source = path.read_text(encoding='utf-8')

          def set_value(text, section, key, value):
              match = re.search(rf'(?ms)^\[{re.escape(section)}\]\s*\n.*?(?=^\[|\Z)', text)
              if match is None:
                  raise SystemExit(f'configuration has no [{section}] section')
              line = f'{key} = ' + json.dumps(value, ensure_ascii=False)
              updated, count = re.subn(rf'^{key}\s*=.*$', line, match.group(), count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'configuration has no {section}.{key} field')
              return text[:match.start()] + updated + text[match.end():]

          if os.environ.get('TRANSLATION_PROVIDER'):
              source = set_value(source, 'translation', 'provider', provider)
          if label is not None:
              source = set_value(source, 'translation', 'label', label)
          if os.environ.get('STATE_BRANCH'):
              source = set_value(source, 'archive', 'state_branch', branch)
          if not config['archive']['public_base_url']:
              from urllib.parse import quote
              source = set_value(source, 'archive', 'public_base_url',
                                 f'https://raw.githubusercontent.com/{repository}/{quote(branch, safe="")}')
          path.write_text(source, encoding='utf-8')
          # Re-validate the rewritten TOML before any external request.
          final = load_config(path)
          load_prompts(final)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'state_branch={final["archive"]["state_branch"]}\n')
          PY
      - name: Check public files and repository visibility
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SEND: ${{ github.event.inputs.send }}
        run: |
          set -euo pipefail
          python scripts/check_public_files.py --tracked-only
          if [[ "$EVENT_NAME" == "schedule" || "$INPUT_SEND" == "true" ]]; then
            python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
          with urlopen(Request(url, headers={'Accept': 'application/vnd.github+json',
                                             'User-Agent': 'ArxivDaily-preflight'}), timeout=15) as response:
              details = json.load(response)
          if details.get('private') is not False:
              raise SystemExit('The repository must be publicly readable before a real delivery')
          PY
          fi
      - name: Check state branch
        id: state_ref
        env:
          STATE_BRANCH: ${{ steps.config.outputs.state_branch }}
        run: |
          set -euo pipefail
          ref="$(git ls-remote --heads origin "refs/heads/$STATE_BRANCH")"
          if [[ -n "$ref" ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap empty state branch
        if: steps.state_ref.outputs.exists == 'false' && (github.event_name == 'schedule' || inputs.send == true)
        env:
          STATE_BRANCH: ${{ steps.config.outputs.state_branch }}
        run: |
          set -euo pipefail
          # Build a one-file root commit without checking out or copying code.
          python - <<'PY'
          import json
          from pathlib import Path
          state = {'schema_version': 1, 'collection': {}, 'papers': {}, 'runs': [],
                   'digests': {}, 'chains': {}, 'daily': {}, 'usage': []}
          Path('tmp/bootstrap-state.json').write_text(json.dumps(state, sort_keys=True) + '\n', encoding='utf-8')
          PY
          blob="$(git hash-object -w tmp/bootstrap-state.json)"
          tree="$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)"
          commit="$(printf 'Initialize ArxivDaily state\n' | git -c user.name=ArxivDaily -c user.email=arxivdaily@users.noreply.github.com commit-tree "$tree")"
          git push --quiet origin "$commit:refs/heads/$STATE_BRANCH"
      - name: Check out persistent state branch
        if: steps.state_ref.outputs.exists == 'true' || github.event_name == 'schedule' || inputs.send == true
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.config.outputs.state_branch }}
          path: app/.state
          fetch-depth: 1
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Run digest and checkpoint before side effects
        env:
          # Rules mode only needs the push key; no LLM or translation secret.
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_IDS: ${{ github.event.inputs.ids }}
          INPUT_RETRY_STAGE: ${{ github.event.inputs.retry_stage }}
          INPUT_START: ${{ github.event.inputs.start }}
          INPUT_END: ${{ github.event.inputs.end }}
          INPUT_SEND: ${{ github.event.inputs.send }}
          EVENT_NAME: ${{ github.event_name }}
          CHECKPOINT_COMMAND: >-
            python scripts/publish_state.py
            --state-dir .state
            --branch ${{ steps.config.outputs.state_branch }}
            --repository ${{ github.repository }}
            --message arxivdaily-checkpoint
        run: |
          set -euo pipefail
          args=(--config ../config.toml --state-dir .state)
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            mode=daily
            do_send=true
          else
            mode="$INPUT_MODE"
            do_send="$INPUT_SEND"
          fi
          if [[ "$mode" == "replay" || "$mode" == "retry" ]]; then
            [[ -n "$INPUT_IDS" ]] || { echo 'Replay or retry requires ids'; exit 2; }
            id_text="${INPUT_IDS//,/ }"
            id_text="${id_text//$'\n'/ }"
            read -r -a selected_ids <<< "$id_text"
            [[ ${#selected_ids[@]} -gt 0 ]] || { echo 'Replay or retry requires ids'; exit 2; }
          fi
          case "$mode" in
            daily)
              command=run
              ;;
            replay)
              command=replay
              args+=(--ids "${selected_ids[@]}")
              ;;
            backfill)
              [[ -n "$INPUT_START" && -n "$INPUT_END" ]] || { echo 'Backfill requires start and end'; exit 2; }
              command=run
              args+=(--start "$INPUT_START" --end "$INPUT_END")
              ;;
            retry)
              [[ -n "$INPUT_RETRY_STAGE" ]] || { echo 'Retry requires a stage'; exit 2; }
              command=run
              args+=(--retry-stage "$INPUT_RETRY_STAGE" --retry-ids "${selected_ids[@]}")
              ;;
            *)
              echo 'Invalid dispatch mode'
              exit 2
              ;;
          esac
          if [[ "$do_send" == "true" ]]; then
            args+=(--send --checkpoint-command "$CHECKPOINT_COMMAND")
          else
            args+=(--live)
          fi
          python -m arxivdaily.cli "$command" "${args[@]}"
      - name: Summarize run
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          PROVIDER: ${{ matrix.translation.provider }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then mode=daily; else mode="$INPUT_MODE"; fi
          printf '## ArxivDaily (%s)\n\nMode: %s\n\n' "$PROVIDER" "$mode" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f tmp/reports/run.json ]]; then
            printf 'A redacted run report is available in the arxivdaily-run-report-%s artifact.\n' "$PROVIDER" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'No run report was produced. Review the job failure and persistent state.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload redacted run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arxivdaily-run-report-${{ matrix.translation.provider }}
          path: app/tmp/reports/run.json
          if-no-files-found: ignore
          retention-days: 3
